## ======================== Basic Settings ======================== ##

display_language: "zh-CN"

# API settings
api:
  key: 'sk-684889fcdbf442178ba3ec0d1e99aff9'
  base_url: 'http://localhost:11434'
  model: 'qwen3-4k'
  llm_support_json: false
  # *Single response max tokens; prevent output truncation in one-shot/large-batch translation
  max_tokens: 8192
  # *When using Ollama locally, call the native /api/chat endpoint with thinking disabled (think=false).
  # qwen3 thinking mode cannot be turned off via the /v1 OpenAI-compatible endpoint, which slows translation ~10x.
  use_ollama_native: true
# *Dedicated model for sentence splitting. qwen3-8k follows instructions and outputs the JSON directly,
# while qwen3-4k tends to write a long analysis that exhausts max_tokens without ever emitting the JSON.
split_model: 'qwen3-8k'
# *Dedicated model for translation. qwen3-4k generates ~90 tok/s (vs ~10 tok/s for qwen3-8k), but may
# misalign lines on long chunks; qwen3-8k is more reliable but ~10x slower.
translate_model: 'qwen3-4k'
# *Number of LLM multi-threaded accesses, set to 1 if using local LLM
max_workers: 1

# Language settings, written into the prompt, can be described in natural language
target_language: '简体中文'

# Whether to use Demucs for vocal separation before transcription
demucs: false

whisper:
  # ["large-v3", "large-v3-turbo"]. Note: for zh model will force to use Belle/large-v3
  model: 'small'
  # Whisper specified recognition language ISO 639-1
  language: 'en'
  model_size: 'large-v3'
  detected_language: 'en'
  # Whisper running mode ["local", "cloud", "elevenlabs"]. Specifies where to run, cloud uses 302.ai API
  runtime: 'local'
  # Whether to enable Pyannote speaker diarization (only works with local runtime)
  diarize: true
  # Expected number of speakers, 0 means auto-detect
  num_speakers: 0
  # 302.ai API key
  whisperX_302_api_key: 'your_302_api_key'
  # ElevenLabs API key (experimental)
  elevenlabs_api_key: 'your_elevenlabs_api_key'

# Whether to burn subtitles into the video
burn_subtitles: true

## ======================== Advanced Settings ======================== ##
# *🔬 h264_nvenc GPU acceleration for ffmpeg, make sure your GPU supports it
ffmpeg_gpu: true

# *Youtube settings
youtube:
  cookies_path: ''

# *Default resolution for downloading YouTube videos [360, 1080, best]
ytb_resolution: '1080'

subtitle:
  # *Maximum length of each subtitle line in characters
  max_length: 100
  # *Translated subtitles are slightly larger than source subtitles, affecting the reference length for subtitle splitting
  target_multiplier: 1.2
  font: 'Microsoft YaHei'     # 默认字体
  trans_color_hex: '#707ce4'  # 网页显示的 Hex 颜色
  trans_color: '&He47c70'     # FFmpeg 使用的 ASS 颜色
  use_bg: false # 默认开启背景  
  font_size: 10  # 默认翻译字幕字号
# *Summary length, set low to 2k if using local LLM
summary_length: 2000

# *Translation chunking: chars per chunk & max lines per chunk.
# 云端可调大省 token（如 2000/40）；本地模型建议 1000/20，避免超时和上下文溢出
translate_chunk_size: 2000
translate_max_i: 40

# *One-shot translation: when enabled and the whole video text ≤ translate_one_shot_max_chars,
# all subtitle lines are translated in a single LLM call (minimum tokens). Otherwise falls back to chunked translation.
translate_one_shot: false
translate_one_shot_max_chars: 8000

# *Compact translation output: when enabled, the translation JSON returns only translations (no origin echo),
# reducing translation output tokens by ~1/3.
compact_translate_output: false

# *Heuristic-first meaning split: when enabled, long sentences are split locally at punctuation/conjunctions first,
# and only fall back to LLM when the heuristic fails (saves tokens, slightly less natural split points).
split_meaning_heuristic_first: true

# *Maximum number of words for the first rough cut, below 18 will cut too finely affecting translation, above 22 is too long and will make subsequent subtitle splitting difficult to align
max_split_length: 20

# *Whether to reflect the translation result in the original text
# false 时使用单遍自然翻译（直译+润色一次完成），大幅节省 token；true 时为两遍翻译（直译+意译润色）
reflect_translate: false

# *Whether to pause after extracting professional terms and before translation, allowing users to manually adjust the terminology table output\log\terminology.json
pause_before_translate: false

## ======================== Dubbing Settings ======================== ##
